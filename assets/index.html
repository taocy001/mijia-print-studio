<!doctype html>
<html lang="zh-CN"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, viewport-fit=cover"><meta name="theme-color" content="#111214"><title>留影工坊</title><link rel="stylesheet" href="style.css"><link rel="stylesheet" href="minimal.css"><link rel="stylesheet" href="browser.css"></head>
<body>
<div class="app">
 <header class="topbar"><button id="menuBtn" aria-label="更多：打印机与记录"><span class="ellipsis">•••</span></button><button id="paperBtn" class="paper-switch">6 寸相纸 <span data-icon="chevron"></span></button><button class="print-button" id="printBtn" disabled><span data-icon="printer"></span><span>预览打印</span><span data-icon="arrow"></span></button></header><div hidden><button id="historyBtn"></button></div>
 <button hidden class="device" id="deviceBtn"><span class="device-icon" data-icon="printer"></span><span class="device-copy"><strong>米家桌面照片机 2</strong><span id="deviceText">点击连接 · 蓝牙直连</span></span><span class="device-tag" id="paperTag">6 寸</span><span data-icon="chevron"></span></button>
 <section class="intro" id="intro"><div class="eyebrow">MADE TO BE HELD</div><h2>把这一刻，<em>留在纸上。</em></h2><p>挑一张喜欢的照片，其余交给工坊。</p></section>
 <nav hidden class="modes" aria-label="创作类型" id="modes"></nav>
 <section class="workspace" aria-label="打印预览">
  <div class="workspace-head"><span><i class="tiny-dot"></i> <span id="previewTitle">你的下一张珍藏</span></span></div>
<div id="editorToolbar" hidden></div>
  <div class="board" id="board">
   <div class="empty" id="empty"><div class="paper-art" aria-hidden="true"><div class="back-print"></div><div class="front-print"><div class="art-landscape"><span class="sun"></span><span class="hill hill-a"></span><span class="hill hill-b"></span></div><div class="art-caption">a moment to keep.</div></div><span class="art-spark">✳</span></div><button class="add-primary" id="addFirst"><span data-icon="plus"></span> 添加照片</button><p>从手机相册选择 · 照片仅保存在本机</p><button class="sample-link" id="sampleBtn">先用示例体验 <span>↗</span></button></div>
   <div id="paperStage" hidden><canvas id="preview" aria-label="原图与打印效果，拖动虚线边缘调整打印区域；照片上滑动浏览，双指缩放；点选文字或表情编辑" hidden></canvas><div id="layerSelection" hidden aria-hidden="true"></div><button id="layerResize" aria-label="拖动缩放选中的文字或表情" hidden><span data-icon="resize"></span></button><span id="originalBadge" hidden>原片 · 松开恢复</span></div>
   <div class="tools photo-tools" aria-label="照片快捷工具"><button id="zoomOut" aria-label="缩小照片"><span data-icon="minus"></span><small>缩小</small></button><button id="zoomIn" aria-label="放大照片"><span data-icon="plus"></span><small>放大</small></button><button id="reset" aria-label="复位照片的裁剪和方向"><span data-icon="reset"></span><small>复位</small></button><button id="compare" aria-label="按住对比原图"><span data-icon="compare"></span><small>按住对比</small></button><button id="rotate" aria-label="顺时针旋转照片90度"><span data-icon="rotate"></span><small>旋转90°</small></button></div><span class="board-corner top-left" aria-hidden="true"></span><span class="board-corner bottom-right" aria-hidden="true"></span>
   <div class="splice-guide" id="spliceGuide" hidden></div>
  </div>
  <p class="canvas-guide">虚线内打印 · 框外裁掉</p><div class="preview-meta"><span id="paperInfo">6 寸 · 102 × 152 mm</span><span id="gestureHint">好照片，值得一张相纸</span></div>
 </section><section class="editor-controls"><div id="layerTools" hidden><span id="layerName">已选文字</span><button id="editLayer">编辑</button><button id="copyLayer">复制</button><button id="orderLayer" aria-label="调整对象层级">层级</button><button id="deleteLayer" aria-label="删除选中的对象">删除</button><button id="deselectLayer" aria-label="取消选中对象">取消选中</button></div><div class="photo-strip" id="photos" aria-label="已选照片"></div></section>
 <div class="editing" id="editing" hidden>


 </div>
 <div hidden><button id="textBtn"></button><span id="layoutSummary"></span><span id="filterSummary"></span><span id="textSummary"></span><div id="decorationActions"></div></div>
 <p class="footnote">一张照片，一段可以触摸的记忆。</p>
</div>
<footer class="dock"><div class="job-banner" id="jobBanner" hidden><div><span id="jobLabel"></span><button id="jobAction">查看</button></div><div class="progress-track"><i id="jobProgress"></i></div></div><nav class="tool-tabs" aria-label="编辑工具"><button id="layoutBtn"><span data-icon="layout"></span><span>排版</span></button><button id="filterBtn"><span data-icon="spark"></span><span>色调</span></button><button id="templateBtn"><span data-icon="template"></span><span>模板</span></button><button id="addTextQuick"><span data-icon="text"></span><span>文字</span></button><button id="addEmojiQuick"><span data-icon="emoji"></span><span>表情</span></button></nav><div hidden><span id="dockTitle"></span><span id="dockMeta"></span></div></footer>
<div class="scrim" id="scrim" hidden></div><section class="sheet" id="sheet" role="dialog" aria-modal="true" aria-labelledby="sheetTitle" hidden><button class="sheet-handle" id="sheetHandle" aria-label="拖动调整面板高度，点按展开或收起"><span></span></button><header><div><small id="sheetKicker">THE DETAILS</small><h2 id="sheetTitle"></h2></div><button id="closeSheet" class="close" aria-label="收起面板">收起</button></header><div id="sheetBody"></div></section>
<div class="toast" id="toast" role="status" hidden></div><div class="loading" id="loading" hidden><span class="spinner"></span><p>正在准备照片…</p></div>
<script src="session.js"></script><script src="browser.js"></script><script src="template-catalog.js"></script><script src="calendar-data.js"></script><script src="tone.js"></script><script src="name-label-catalog.js"></script><script src="artwork.js"></script><script src="name-labels.js"></script><script src="card-catalog.js"></script><script src="card-art.js"></script><script src="app.js"></script><script src="emoji-catalog.js"></script><script src="layers.js"></script><script src="crop.js"></script><script src="original-templates.js"></script><script src="templates.js"></script><script src="drawer.js"></script><script src="floating-tools.js"></script><script src="extras.js"></script><script src="cutout.js"></script><script src="landscape.js"></script><script src="sharing.js"></script><script src="desktop.js"></script>
</body></html>
