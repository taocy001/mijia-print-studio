name: Interface regression
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  offline:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install playwright==1.64.1 Pillow==13.0.0
      - run: python -m playwright install --with-deps chromium
      - name: Offline status and editor checks
        run: python tests/run_interface_checks.py
